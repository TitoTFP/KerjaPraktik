[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "laporan-kerja-praktik-pengangguran"
version = "0.1.0"
description = "Analisis deskriptif data pengangguran Kabupaten Tuban untuk laporan kerja praktik."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/laporan_kerja_praktik"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
