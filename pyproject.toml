[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "laporan-kerja-praktik-pengangguran"
version = "0.1.0"
description = "Analisis deskriptif data pengangguran Kabupaten Tuban untuk laporan kerja praktik."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "pandas>=2.2",
    "scipy>=1.15",
]

[project.optional-dependencies]
dashboard = [
    "plotly==7.0.0",
    "shapely==2.1.2",
    "streamlit==1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/laporan_kerja_praktik"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
